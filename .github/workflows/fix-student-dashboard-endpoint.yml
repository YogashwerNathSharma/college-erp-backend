name: Fix student dashboard endpoint

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct dashboard API endpoint
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/pages/students/AdminStudentDashboard.tsx')
          s = p.read_text()
          old = 'getFullUrl("/api/students/dashboard/full")'
          new = 'getFullUrl("/api/students/full")'
          if old not in s:
              raise SystemExit('Expected student dashboard endpoint not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/students/AdminStudentDashboard.tsx
          git commit -m "fix: correct student dashboard API endpoint"
          git rm .github/workflows/fix-student-dashboard-endpoint.yml
          git commit --amend --no-edit
          git push
