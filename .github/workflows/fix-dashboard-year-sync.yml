name: Fix dashboard year synchronization

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Synchronize student and main dashboard academic year
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('frontend/src/pages/students/AdminStudentDashboard.tsx')
          s = p.read_text()

          if 'useAcademicYear' not in s:
              s = s.replace(
                  'import { getFullUrl } from "../../utils/url";',
                  'import { getFullUrl } from "../../utils/url";\nimport { useAcademicYear } from "../../context/AcademicYearContext";',
                  1,
              )

          old = '''  const [loading, setLoading] = useState(true);\n  const [data, setData] = useState<DashboardData | null>(null);\n  const [academicYearId, setAcademicYearId] = useState<string>("");\n  const [academicYears, setAcademicYears] = useState<Array<{ id: string; name: string }>>([]);'''
          new = '''  const [loading, setLoading] = useState(true);\n  const [data, setData] = useState<DashboardData | null>(null);\n  const {\n    academicYears,\n    selectedAcademicYearId,\n    setSelectedAcademicYear,\n  } = useAcademicYear();'''
          if old in s:
              s = s.replace(old, new, 1)

          s = s.replace('const params = academicYearId ? { academicYearId } : {};', 'const params = selectedAcademicYearId ? { academicYearId: selectedAcademicYearId } : {};', 1)
          s = s.replace('''  }, [academicYearId]);''', '''  }, [selectedAcademicYearId]);''', 1)

          old = '''  const fetchAcademicYears = async () => {\n    try {\n      const res = await axios.get(getFullUrl("/api/academic"), authHeaders());\n      if (res.data?.success) setAcademicYears(res.data.data || []);\n    } catch { /* silent */ }\n  };\n\n  useEffect(() => { fetchAcademicYears(); }, []);\n  useEffect(() => { fetchDashboard(); }, [fetchDashboard]);'''
          new = '''  useEffect(() => {\n    fetchDashboard();\n  }, [fetchDashboard]);'''
          if old in s:
              s = s.replace(old, new, 1)

          old = '''            value={academicYearId}\n            onChange={(e) => setAcademicYearId(e.target.value)}'''
          new = '''            value={selectedAcademicYearId || ""}\n            onChange={(e) => {\n              const year = academicYears.find((ay) => ay.id === e.target.value);\n              if (year) setSelectedAcademicYear({ ...year, startDate: "", endDate: "", isActive: true, isCurrent: false });\n            }}'''
          if old in s:
              s = s.replace(old, new, 1)

          # All fallback requests must use the same selected global year.
          s = s.replace('{ params: { academicYearId }, ...authHeaders() }', '{ params: { academicYearId: selectedAcademicYearId || undefined }, ...authHeaders() }')

          p.write_text(s)
          PY

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/students/AdminStudentDashboard.tsx
          git commit -m "fix: synchronize dashboard academic year selection"
          git rm .github/workflows/fix-dashboard-year-sync.yml
          git commit --amend --no-edit
          git push
