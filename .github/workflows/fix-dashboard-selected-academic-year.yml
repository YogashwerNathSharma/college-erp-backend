name: Fix dashboard selected academic year

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make dashboard follow selected academic year
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('frontend/src/pages/TenantDashboard.tsx')
          s = p.read_text()

          if 'useAcademicYear' not in s:
              s = s.replace(
                  'import { useEffect, useState } from "react";',
                  'import { useEffect, useState } from "react";\nimport { useAcademicYear } from "../context/AcademicYearContext";',
                  1,
              )

          if 'selectedAcademicYearId' not in s:
              s = s.replace(
                  '  const navigate = useNavigate();\n',
                  '  const navigate = useNavigate();\n  const { selectedAcademicYear, selectedAcademicYearId, loading: academicYearLoading } = useAcademicYear();\n',
                  1,
              )

          s = s.replace(
              'localStorage.getItem("dashboard_cache")',
              'localStorage.getItem(`dashboard_cache:${localStorage.getItem("selectedAcademicYearId") || "none"}`)',
          )

          old = '        const url = refresh ? "/api/dashboard?refresh=true" : "/api/dashboard";\n        const res = await axios.get(getFullUrl(url), { headers });'
          new = '        if (!selectedAcademicYearId) return;\n        const url = refresh ? "/api/dashboard?refresh=true" : "/api/dashboard";\n        const res = await axios.get(getFullUrl(url), {\n          headers,\n          params: { academicYearId: selectedAcademicYearId },\n        });'
          if old in s:
              s = s.replace(old, new, 1)

          s = s.replace(
              'localStorage.setItem("dashboard_cache", JSON.stringify({',
              'localStorage.setItem(`dashboard_cache:${selectedAcademicYearId}`, JSON.stringify({',
              1,
          )

          old = '''  useEffect(() => {\n    fetchAll(isPageRefresh);\n  }, []);'''
          new = '''  useEffect(() => {\n    if (academicYearLoading || !selectedAcademicYearId) return;\n    fetchAll(isPageRefresh);\n  }, [academicYearLoading, selectedAcademicYearId]);'''
          if old in s:
              s = s.replace(old, new, 1)

          s = s.replace('{getCurrentSession()}', '{selectedAcademicYear?.name || "—"}')
          p.write_text(s)

          # Teacher count must follow the selected academic year too.
          p = Path('backend/src/modules/dashboard/dashboard.controller.ts')
          s = p.read_text()
          old = '        prisma.teacher.count({ where: { tenantId, isDeleted: false } }),' 
          new = '''        prisma.teacher.count({\n          where: {\n            tenantId,\n            isDeleted: false,\n            ...(academicYearId ? { academicYearId } : {}),\n          },\n        }),'''
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/TenantDashboard.tsx backend/src/modules/dashboard/dashboard.controller.ts
          git commit -m "fix: make dashboard follow selected academic year"
          git rm .github/workflows/fix-dashboard-selected-academic-year.yml
          git commit --amend --no-edit
          git push
