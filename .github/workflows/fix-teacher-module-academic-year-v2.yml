name: Fix Teacher Module Academic Year V2

on:
  push:
    branches: [main]

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply corrected academic-year scoping
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def repl(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'Expected text not found in {path}: {old[:140]}')
              p.write_text(s.replace(old, new, count))

          # FRONTEND: Teacher Dashboard follows global academic year and refetches on change.
          repl('frontend/src/pages/teachers/TeacherDashboard.tsx',
               'import { getFullUrl } from "../../utils/url";\nimport { useNavigate } from "react-router-dom";',
               'import { getFullUrl } from "../../utils/url";\nimport { useNavigate } from "react-router-dom";\nimport { useAcademicYear } from "../../context/AcademicYearContext";')
          repl('frontend/src/pages/teachers/TeacherDashboard.tsx',
               'export default function TeacherDashboard() {\n  const navigate = useNavigate();',
               'export default function TeacherDashboard() {\n  const navigate = useNavigate();\n  const { selectedAcademicYearId, loading: academicYearLoading } = useAcademicYear();')
          repl('frontend/src/pages/teachers/TeacherDashboard.tsx',
               '    fetchDashboardData(isPageRefresh);\n  }, []);',
               '    if (!academicYearLoading && selectedAcademicYearId) {\n      fetchDashboardData(isPageRefresh);\n    }\n  }, [academicYearLoading, selectedAcademicYearId]);')
          repl('frontend/src/pages/teachers/TeacherDashboard.tsx',
               '      const url = refresh ? "/api/teacher/dashboard?refresh=true" : "/api/teacher/dashboard";\n      const res = await axios.get(getFullUrl(url), { headers });',
               '      const params = { academicYearId: selectedAcademicYearId, ...(refresh ? { refresh: "true" } : {}) };\n      const res = await axios.get(getFullUrl("/api/teacher/dashboard"), { headers, params });')

          # ROUTES: resolve academic year for teacher create/update as well as reads/deletes.
          p = Path('backend/src/modules/teacher/teacher.routes.ts')
          s = p.read_text()
          s = s.replace('resolveTenant,\n  checkLimit("teachers"),', 'resolveTenant,\n  resolveAcademicYear,\n  checkLimit("teachers"),', 1)
          s = s.replace('resolveTenant,\n  upload.single("photo"),\n  update', 'resolveTenant,\n  resolveAcademicYear,\n  upload.single("photo"),\n  update', 1)
          s = s.replace('resolveTenant,\n  upload.single("photo"),\n  partialUpdate', 'resolveTenant,\n  resolveAcademicYear,\n  upload.single("photo"),\n  partialUpdate', 1)
          p.write_text(s)

          # TEACHER CONTROLLER: propagate middleware-resolved academic year everywhere.
          p = Path('backend/src/modules/teacher/teacher.controller.ts')
          s = p.read_text()
          s = s.replace('    const data = parseFormArrays({ ...req.body });\n\n    if (req.file)',
                        '    const data = parseFormArrays({ ...req.body });\n    data.academicYearId = (req as any).academicYearId || data.academicYearId;\n\n    if (req.file)', 1)
          s = s.replace('    const data = await getTeachers(req.query, tenantId);',
                        '    const data = await getTeachers({ ...req.query, academicYearId: (req as any).academicYearId || req.query.academicYearId }, tenantId);', 1)
          s = s.replace('    const teacher = await getTeacherById(id, tenantId);',
                        '    const teacher = await getTeacherById(id, tenantId, (req as any).academicYearId);', 1)
          # update and patch each have same parse block; add AY to both remaining occurrences
          s = s.replace('    const data = parseFormArrays({ ...req.body });\n\n    if (req.file)',
                        '    const data = parseFormArrays({ ...req.body });\n    data.academicYearId = (req as any).academicYearId || data.academicYearId;\n\n    if (req.file)', 2)
          s = s.replace('    await deleteTeacher(id, tenantId);',
                        '    await deleteTeacher(id, tenantId, (req as any).academicYearId);', 1)
          # Primary dashboard endpoint.
          s = s.replace('    const now = new Date();\n    const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);',
                        '    const academicYearId = (req as any).academicYearId as string | undefined;\n    const now = new Date();\n    const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);', 1)
          s = s.replace('prisma.teacher.count({ where: { tenantId, isDeleted: false } }),',
                        'prisma.teacher.count({ where: { tenantId, isDeleted: false, ...(academicYearId ? { academicYearId } : {}) } }),', 1)
          s = s.replace('prisma.leave.count({ where: { tenantId, status: "APPROVED", endDate: { gte: now }, startDate: { lte: now } } }).catch(() => 0),',
                        'prisma.leave.count({ where: { tenantId, isDeleted: false, ...(academicYearId ? { academicYearId } : {}), status: "APPROVED", endDate: { gte: now }, startDate: { lte: now } } }).catch(() => 0),', 1)
          s = s.replace('prisma.teacher.count({ where: { tenantId, isDeleted: false, createdAt: { gte: startOfMonth } } }),',
                        'prisma.teacher.count({ where: { tenantId, isDeleted: false, ...(academicYearId ? { academicYearId } : {}), createdAt: { gte: startOfMonth } } }),', 1)
          s = s.replace('prisma.teacher.count({ where: { tenantId, isDeleted: false, gender: "MALE" } }),',
                        'prisma.teacher.count({ where: { tenantId, isDeleted: false, ...(academicYearId ? { academicYearId } : {}), gender: "MALE" } }),', 1)
          s = s.replace('prisma.teacher.count({ where: { tenantId, isDeleted: false, gender: "FEMALE" } }),',
                        'prisma.teacher.count({ where: { tenantId, isDeleted: false, ...(academicYearId ? { academicYearId } : {}), gender: "FEMALE" } }),', 1)
          s = s.replace('      where: { tenantId, isDeleted: false },\n      select: { departmentId: true, createdAt: true },',
                        '      where: { tenantId, isDeleted: false, ...(academicYearId ? { academicYearId } : {}) },\n      select: { departmentId: true, createdAt: true },', 1)
          s = s.replace('          tenantId, isDeleted: false,\n          leaves: { some:',
                        '          tenantId, isDeleted: false, ...(academicYearId ? { academicYearId } : {}),\n          leaves: { some:', 1)
          s = s.replace('            where: { status: "APPROVED", startDate: { lte: now }, endDate: { gte: now } },',
                        '            where: { isDeleted: false, ...(academicYearId ? { academicYearId } : {}), status: "APPROVED", startDate: { lte: now }, endDate: { gte: now } },', 1)
          s = s.replace('        where: { tenantId, month: now.getMonth() + 1, year: now.getFullYear(), status: "PENDING" },',
                        '        where: { tenantId, ...(academicYearId ? { academicYearId } : {}), month: now.getMonth() + 1, year: now.getFullYear(), status: "PENDING" },', 1)
          p.write_text(s)

          # TEACHER SERVICE: year-scoped list/detail/update/delete and duplicate validation.
          p = Path('backend/src/modules/teacher/teacher.service.ts')
          s = p.read_text()
          s = s.replace('      isDeleted: false,\n    },\n  });\n\n  if (existing)',
                        '      isDeleted: false,\n      ...(data.academicYearId ? { academicYearId: data.academicYearId } : {}),\n    },\n  });\n\n  if (existing)', 1)
          s = s.replace('  // Search filter', '  if (query.academicYearId) whereClause.academicYearId = query.academicYearId;\n\n  // Search filter', 1)
          s = s.replace('export const getTeacherById = async (id: string, tenantId: string) => {',
                        'export const getTeacherById = async (id: string, tenantId: string, academicYearId?: string) => {', 1)
          s = s.replace('      id,\n      tenantId,\n      isDeleted: false,\n    },\n    include:',
                        '      id,\n      tenantId,\n      isDeleted: false,\n      ...(academicYearId ? { academicYearId } : {}),\n    },\n    include:', 1)
          s = s.replace('      where: { id, tenantId, isDeleted: false },\n    });\n  });',
                        '      where: { id, tenantId, isDeleted: false, ...(academicYearId ? { academicYearId } : {}) },\n    });\n  });', 1)
          s = s.replace('    where: { id, tenantId, isDeleted: false },\n  });\n\n  if (!existing) {\n    throw new Error("Teacher not found");\n  }\n\n  // Check email uniqueness',
                        '    where: { id, tenantId, isDeleted: false, ...(data.academicYearId ? { academicYearId: data.academicYearId } : {}) },\n  });\n\n  if (!existing) {\n    throw new Error("Teacher not found");\n  }\n\n  // Check email uniqueness', 1)
          s = s.replace('        id: { not: id },\n      },',
                        '        id: { not: id },\n        ...(data.academicYearId ? { academicYearId: data.academicYearId } : {}),\n      },', 1)
          s = s.replace('export const deleteTeacher = async (id: string, tenantId: string) => {',
                        'export const deleteTeacher = async (id: string, tenantId: string, academicYearId?: string) => {', 1)
          # target the deleteTeacher lookup after its signature
          marker = 'export const deleteTeacher = async (id: string, tenantId: string, academicYearId?: string) => {\n  const existing = await prisma.teacher.findFirst({\n    where: { id, tenantId, isDeleted: false },'
          s = s.replace(marker,
                        'export const deleteTeacher = async (id: string, tenantId: string, academicYearId?: string) => {\n  const existing = await prisma.teacher.findFirst({\n    where: { id, tenantId, isDeleted: false, ...(academicYearId ? { academicYearId } : {}) },', 1)
          p.write_text(s)

          # SECONDARY DASHBOARD SERVICE + CONTROLLER: keep all dashboard APIs year-aware and caches isolated.
          p = Path('backend/src/modules/teacher/dashboard.service.ts')
          s = p.read_text()
          s = s.replace('export const getDashboardStats = async (tenantId: string) => {', 'export const getDashboardStats = async (tenantId: string, academicYearId?: string) => {', 1)
          s = s.replace('where: { tenantId, isDeleted: false },', 'where: { tenantId, isDeleted: false, ...(academicYearId ? { academicYearId } : {}) },', 3)
          s = s.replace('export const getDepartmentChart = async (tenantId: string) => {', 'export const getDepartmentChart = async (tenantId: string, academicYearId?: string) => {', 1)
          s = s.replace('teacher: { tenantId, isDeleted: false },', 'teacher: { tenantId, isDeleted: false, ...(academicYearId ? { academicYearId } : {}) },', 1)
          s = s.replace('export const getMonthlyOverview = async (tenantId: string) => {', 'export const getMonthlyOverview = async (tenantId: string, academicYearId?: string) => {', 1)
          s = s.replace('      isDeleted: false,\n      createdAt:', '      isDeleted: false,\n      ...(academicYearId ? { academicYearId } : {}),\n      createdAt:', 1)
          s = s.replace('export const getRecentTeachers = async (tenantId: string) => {', 'export const getRecentTeachers = async (tenantId: string, academicYearId?: string) => {', 1)
          s = s.replace('    where: { tenantId, isDeleted: false },\n    include:', '    where: { tenantId, isDeleted: false, ...(academicYearId ? { academicYearId } : {}) },\n    include:', 1)
          p.write_text(s)

          p = Path('backend/src/modules/teacher/dashboard.controller.ts')
          s = p.read_text()
          for fn in ['getStats','getDeptChart','getOverview','getRecent','getLeaves']:
              marker = f'export const {fn} = async (req: any, res: Response) => {{\n  try {{\n    const tenantId = req.user?.tenantId;'
              if marker in s:
                  s = s.replace(marker, marker + '\n    const academicYearId = (req as any).academicYearId as string | undefined;', 1)
          s = s.replace('`teacher:dash:stats:${tenantId}`', '`teacher:dash:stats:${tenantId}:${academicYearId || "all"}`', 1)
          s = s.replace('getDashboardStats(tenantId)', 'getDashboardStats(tenantId, academicYearId)', 1)
          s = s.replace('`teacher:dash:dept:${tenantId}`', '`teacher:dash:dept:${tenantId}:${academicYearId || "all"}`', 1)
          s = s.replace('getDepartmentChart(tenantId)', 'getDepartmentChart(tenantId, academicYearId)', 1)
          s = s.replace('`teacher:dash:overview:${tenantId}`', '`teacher:dash:overview:${tenantId}:${academicYearId || "all"}`', 1)
          s = s.replace('getMonthlyOverview(tenantId)', 'getMonthlyOverview(tenantId, academicYearId)', 1)
          s = s.replace('getRecentTeachers(tenantId)', 'getRecentTeachers(tenantId, academicYearId)', 1)
          s = s.replace('      where: { tenantId, isDeleted: false },\n      orderBy:', '      where: { tenantId, isDeleted: false, ...(academicYearId ? { academicYearId } : {}) },\n      orderBy:', 1)
          p.write_text(s)

          # LEAVE: all reads/stats/mutations scoped to selected year.
          p = Path('backend/src/modules/teacher/leave.service.ts')
          s = p.read_text()
          s = s.replace('    where: { id: data.teacherId, tenantId, isDeleted: false },', '    where: { id: data.teacherId, tenantId, isDeleted: false, ...(data.academicYearId ? { academicYearId: data.academicYearId } : {}) },', 1)
          s = s.replace('  if (query.teacherId) {', '  if (query.academicYearId) whereClause.academicYearId = query.academicYearId;\n\n  if (query.teacherId) {', 1)
          s = s.replace('export const getLeaveStats = async (tenantId: string, teacherId?: string) => {', 'export const getLeaveStats = async (tenantId: string, teacherId?: string, academicYearId?: string) => {', 1)
          s = s.replace('  const whereBase: any = { tenantId, isDeleted: false };', '  const whereBase: any = { tenantId, isDeleted: false, ...(academicYearId ? { academicYearId } : {}) };', 1)
          s = s.replace('  tenantId: string\n) => {\n  const leave = await prisma.leave.findFirst({\n    where: { id, tenantId, isDeleted: false },',
                        '  tenantId: string,\n  academicYearId?: string\n) => {\n  const leave = await prisma.leave.findFirst({\n    where: { id, tenantId, isDeleted: false, ...(academicYearId ? { academicYearId } : {}) },', 1)
          s = s.replace('export const cancelLeave = async (id: string, tenantId: string) => {\n  const leave = await prisma.leave.findFirst({\n    where: { id, tenantId, isDeleted: false },',
                        'export const cancelLeave = async (id: string, tenantId: string, academicYearId?: string) => {\n  const leave = await prisma.leave.findFirst({\n    where: { id, tenantId, isDeleted: false, ...(academicYearId ? { academicYearId } : {}) },', 1)
          p.write_text(s)

          p = Path('backend/src/modules/teacher/leave.controller.ts')
          s = p.read_text()
          s = s.replace('const data = await getLeaves(req.query, tenantId);', 'const data = await getLeaves({ ...req.query, academicYearId: (req as any).academicYearId || req.query.academicYearId }, tenantId);', 1)
          s = s.replace('const data = await getLeaveStats(tenantId, teacherId);', 'const data = await getLeaveStats(tenantId, teacherId, (req as any).academicYearId);', 1)
          s = s.replace('const data = await updateLeaveStatus(id, status, userId, tenantId);', 'const data = await updateLeaveStatus(id, status, userId, tenantId, (req as any).academicYearId);', 1)
          s = s.replace('await cancelLeave(id, tenantId);', 'await cancelLeave(id, tenantId, (req as any).academicYearId);', 1)
          p.write_text(s)

          # SALARY: create/list/payslip/update all scoped to academic year.
          p = Path('backend/src/modules/teacher/salary.service.ts')
          s = p.read_text()
          s = s.replace('    where: { id: data.teacherId, tenantId, isDeleted: false },', '    where: { id: data.teacherId, tenantId, isDeleted: false, ...(data.academicYearId ? { academicYearId: data.academicYearId } : {}) },', 1)
          s = s.replace('      isDeleted: false,\n    },\n  });\n\n  if (existing)', '      isDeleted: false,\n      ...(data.academicYearId ? { academicYearId: data.academicYearId } : {}),\n    },\n  });\n\n  if (existing)', 1)
          s = s.replace('  if (query.teacherId) whereClause.teacherId = query.teacherId;', '  if (query.academicYearId) whereClause.academicYearId = query.academicYearId;\n  if (query.teacherId) whereClause.teacherId = query.teacherId;', 1)
          s = s.replace('  tenantId: string\n) => {', '  tenantId: string,\n  academicYearId?: string\n) => {', 1)
          s = s.replace('      isDeleted: false,\n    },\n    include:', '      isDeleted: false,\n      ...(academicYearId ? { academicYearId } : {}),\n    },\n    include:', 1)
          s = s.replace('export const updateSalary = async (id: string, data: any, tenantId: string) => {', 'export const updateSalary = async (id: string, data: any, tenantId: string, academicYearId?: string) => {', 1)
          s = s.replace('    where: { id, tenantId, isDeleted: false },\n  });\n\n  if (!existing) {\n    throw new Error("Salary record not found");', '    where: { id, tenantId, isDeleted: false, ...(academicYearId ? { academicYearId } : {}) },\n  });\n\n  if (!existing) {\n    throw new Error("Salary record not found");', 1)
          p.write_text(s)

          p = Path('backend/src/modules/teacher/salary.controller.ts')
          s = p.read_text()
          s = s.replace('const salary = await createSalary(req.body, tenantId);', 'const salary = await createSalary({ ...req.body, academicYearId: (req as any).academicYearId || req.body.academicYearId }, tenantId);', 1)
          s = s.replace('const data = await getSalaries(req.query, tenantId);', 'const data = await getSalaries({ ...req.query, academicYearId: (req as any).academicYearId || req.query.academicYearId }, tenantId);', 1)
          s = s.replace('const data = await getPayslip(teacherId, parseInt(month), parseInt(year), tenantId);', 'const data = await getPayslip(teacherId, parseInt(month), parseInt(year), tenantId, (req as any).academicYearId);', 1)
          s = s.replace('const data = await updateSalary(id, req.body, tenantId);', 'const data = await updateSalary(id, req.body, tenantId, (req as any).academicYearId);', 1)
          p.write_text(s)

          # Standalone teacher dashboard service, if used by future callers.
          p = Path('backend/src/modules/teacher/teacher-dashboard.service.ts')
          s = p.read_text()
          s = s.replace('export const getTeacherDashboardData = async (tenantId: string) => {', 'export const getTeacherDashboardData = async (tenantId: string, academicYearId?: string) => {', 1)
          s = s.replace('    where: { tenantId, isDeleted: false },', '    where: { tenantId, isDeleted: false, ...(academicYearId ? { academicYearId } : {}) },', 1)
          s = s.replace('        tenantId,\n        month: currentMonth,', '        tenantId,\n        ...(academicYearId ? { academicYearId } : {}),\n        month: currentMonth,', 1)
          p.write_text(s)
          PY

      - name: Build frontend and typecheck backend
        shell: bash
        run: |
          cd frontend
          npm ci
          npm run build
          cd ../backend
          npm ci
          npx tsc --noEmit

      - name: Commit fixed teacher module and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-teacher-module-academic-year-v2.yml
          git add frontend/src/pages/teachers/TeacherDashboard.tsx \
                  backend/src/modules/teacher/teacher.routes.ts \
                  backend/src/modules/teacher/teacher.controller.ts \
                  backend/src/modules/teacher/teacher.service.ts \
                  backend/src/modules/teacher/dashboard.controller.ts \
                  backend/src/modules/teacher/dashboard.service.ts \
                  backend/src/modules/teacher/leave.controller.ts \
                  backend/src/modules/teacher/leave.service.ts \
                  backend/src/modules/teacher/salary.controller.ts \
                  backend/src/modules/teacher/salary.service.ts \
                  backend/src/modules/teacher/teacher-dashboard.service.ts
          git commit -m "fix: scope complete teacher module to academic year"
          git push origin main
