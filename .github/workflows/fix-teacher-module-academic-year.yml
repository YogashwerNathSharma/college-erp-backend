name: Fix Teacher Module Academic Year

on:
  push:
    branches: [main]

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply academic-year scoping to teacher module
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'Expected text not found in {path}: {old[:120]}')
              p.write_text(s.replace(old, new, 1))

          # Frontend: admin Teacher Dashboard follows the global academic-year context.
          replace('frontend/src/pages/teachers/TeacherDashboard.tsx',
            'import { getFullUrl } from "../../utils/url";\nimport { useNavigate } from "react-router-dom";',
            'import { getFullUrl } from "../../utils/url";\nimport { useNavigate } from "react-router-dom";\nimport { useAcademicYear } from "../../context/AcademicYearContext";')
          replace('frontend/src/pages/teachers/TeacherDashboard.tsx',
            'export default function TeacherDashboard() {\n  const navigate = useNavigate();',
            'export default function TeacherDashboard() {\n  const navigate = useNavigate();\n  const { selectedAcademicYearId, loading: academicYearLoading } = useAcademicYear();')
          replace('frontend/src/pages/teachers/TeacherDashboard.tsx',
            '    fetchDashboardData(isPageRefresh);\n  }, []);',
            '    if (!academicYearLoading && selectedAcademicYearId) {\n      fetchDashboardData(isPageRefresh);\n    }\n  }, [academicYearLoading, selectedAcademicYearId]);')
          replace('frontend/src/pages/teachers/TeacherDashboard.tsx',
            '      const url = refresh ? "/api/teacher/dashboard?refresh=true" : "/api/teacher/dashboard";\n      const res = await axios.get(getFullUrl(url), { headers });',
            '      const params = { ...(selectedAcademicYearId ? { academicYearId: selectedAcademicYearId } : {}), ...(refresh ? { refresh: "true" } : {}) };\n      const res = await axios.get(getFullUrl("/api/teacher/dashboard"), { headers, params });')

          # Backend: main teacher dashboard endpoint is year-scoped.
          p = Path('backend/src/modules/teacher/teacher.controller.ts')
          s = p.read_text()
          s = s.replace('    const teacher = await createTeacher(data, tenantId);',
                        '    data.academicYearId = (req as any).academicYearId || data.academicYearId;\n    const teacher = await createTeacher(data, tenantId);', 1)
          s = s.replace('    const data = await getTeachers(req.query, tenantId);',
                        '    const data = await getTeachers({ ...req.query, academicYearId: (req as any).academicYearId || req.query.academicYearId }, tenantId);', 1)
          s = s.replace('    const teacher = await getTeacherById(id, tenantId);',
                        '    const teacher = await getTeacherById(id, tenantId, (req as any).academicYearId);', 1)
          s = s.replace('    const teacher = await updateTeacher(id, data, tenantId);',
                        '    data.academicYearId = (req as any).academicYearId || data.academicYearId;\n    const teacher = await updateTeacher(id, data, tenantId);', 1)
          s = s.replace('    await deleteTeacher(id, tenantId);',
                        '    await deleteTeacher(id, tenantId, (req as any).academicYearId);', 1)
          # Dashboard base counts.
          s = s.replace('    const now = new Date();\n    const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);',
                        '    const academicYearId = (req as any).academicYearId as string | undefined;\n    const now = new Date();\n    const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);', 1)
          s = s.replace('prisma.teacher.count({ where: { tenantId, isDeleted: false } }),',
                        'prisma.teacher.count({ where: { tenantId, isDeleted: false, ...(academicYearId ? { academicYearId } : {}) } }),', 1)
          s = s.replace('prisma.leave.count({ where: { tenantId, status: "APPROVED", endDate: { gte: now }, startDate: { lte: now } } }).catch(() => 0),',
                        'prisma.leave.count({ where: { tenantId, isDeleted: false, ...(academicYearId ? { academicYearId } : {}), status: "APPROVED", endDate: { gte: now }, startDate: { lte: now } } }).catch(() => 0),', 1)
          s = s.replace('prisma.teacher.count({ where: { tenantId, isDeleted: false, createdAt: { gte: startOfMonth } } }),',
                        'prisma.teacher.count({ where: { tenantId, isDeleted: false, ...(academicYearId ? { academicYearId } : {}), createdAt: { gte: startOfMonth } } }),', 1)
          s = s.replace('prisma.teacher.count({ where: { tenantId, isDeleted: false, gender: "MALE" } }),',
                        'prisma.teacher.count({ where: { tenantId, isDeleted: false, ...(academicYearId ? { academicYearId } : {}), gender: "MALE" } }),', 1)
          s = s.replace('prisma.teacher.count({ where: { tenantId, isDeleted: false, gender: "FEMALE" } }),',
                        'prisma.teacher.count({ where: { tenantId, isDeleted: false, ...(academicYearId ? { academicYearId } : {}), gender: "FEMALE" } }),', 1)
          s = s.replace('where: { tenantId, isDeleted: false },\n      select: { departmentId: true, createdAt: true },',
                        'where: { tenantId, isDeleted: false, ...(academicYearId ? { academicYearId } : {}) },\n      select: { departmentId: true, createdAt: true },', 1)
          s = s.replace('tenantId, isDeleted: false,\n          leaves:',
                        'tenantId, isDeleted: false, ...(academicYearId ? { academicYearId } : {}),\n          leaves:', 1)
          s = s.replace('where: { status: "APPROVED", startDate: { lte: now }, endDate: { gte: now } },',
                        'where: { isDeleted: false, status: "APPROVED", startDate: { lte: now }, endDate: { gte: now } },', 1)
          s = s.replace('where: { tenantId, month: now.getMonth() + 1, year: now.getFullYear(), status: "PENDING" },',
                        'where: { tenantId, ...(academicYearId ? { academicYearId } : {}), month: now.getMonth() + 1, year: now.getFullYear(), status: "PENDING" },', 1)
          p.write_text(s)

          # Backend teacher list/detail service.
          p = Path('backend/src/modules/teacher/teacher.service.ts')
          s = p.read_text()
          s = s.replace('    isDeleted: false,\n  };\n\n  // Search filter',
                        '    isDeleted: false,\n  };\n\n  if (query.academicYearId) whereClause.academicYearId = query.academicYearId;\n\n  // Search filter', 1)
          s = s.replace('export const getTeacherById = async (id: string, tenantId: string) => {',
                        'export const getTeacherById = async (id: string, tenantId: string, academicYearId?: string) => {', 1)
          s = s.replace('      tenantId,\n      isDeleted: false,\n    },\n    include:',
                        '      tenantId,\n      isDeleted: false,\n      ...(academicYearId ? { academicYearId } : {}),\n    },\n    include:', 1)
          s = s.replace('export const deleteTeacher = async (id: string, tenantId: string) => {',
                        'export const deleteTeacher = async (id: string, tenantId: string, academicYearId?: string) => {', 1)
          s = s.replace('    where: { id, tenantId, isDeleted: false },\n  });\n\n  if (!existing) {',
                        '    where: { id, tenantId, isDeleted: false, ...(academicYearId ? { academicYearId } : {}) },\n  });\n\n  if (!existing) {', 1)
          p.write_text(s)

          # Backend dashboard service used by /api/teacher/dashboard/* routes.
          p = Path('backend/src/modules/teacher/dashboard.service.ts')
          s = p.read_text()
          s = s.replace('export const getDashboardStats = async (tenantId: string) => {',
                        'export const getDashboardStats = async (tenantId: string, academicYearId?: string) => {', 1)
          s = s.replace('where: { tenantId, isDeleted: false },',
                        'where: { tenantId, isDeleted: false, ...(academicYearId ? { academicYearId } : {}) },', 3)
          s = s.replace('export const getDepartmentChart = async (tenantId: string) => {',
                        'export const getDepartmentChart = async (tenantId: string, academicYearId?: string) => {', 1)
          s = s.replace('teacher: { tenantId, isDeleted: false },',
                        'teacher: { tenantId, isDeleted: false, ...(academicYearId ? { academicYearId } : {}) },', 1)
          s = s.replace('export const getMonthlyOverview = async (tenantId: string) => {',
                        'export const getMonthlyOverview = async (tenantId: string, academicYearId?: string) => {', 1)
          s = s.replace('      tenantId,\n      isDeleted: false,\n      createdAt:',
                        '      tenantId,\n      isDeleted: false,\n      ...(academicYearId ? { academicYearId } : {}),\n      createdAt:', 1)
          s = s.replace('export const getRecentTeachers = async (tenantId: string) => {',
                        'export const getRecentTeachers = async (tenantId: string, academicYearId?: string) => {', 1)
          s = s.replace('where: { tenantId, isDeleted: false },\n    include:',
                        'where: { tenantId, isDeleted: false, ...(academicYearId ? { academicYearId } : {}) },\n    include:', 1)
          p.write_text(s)

          # Backend dashboard controller: year-aware service calls and cache keys.
          p = Path('backend/src/modules/teacher/dashboard.controller.ts')
          s = p.read_text()
          s = s.replace('    const tenantId = req.user?.tenantId;\n    if (!tenantId) {',
                        '    const tenantId = req.user?.tenantId;\n    const academicYearId = (req as any).academicYearId as string | undefined;\n    if (!tenantId) {', 1)
          s = s.replace('const cacheKey = `teacher:dash:stats:${tenantId}`;',
                        'const cacheKey = `teacher:dash:stats:${tenantId}:${academicYearId || "all"}`;', 1)
          s = s.replace('getDashboardStats(tenantId)', 'getDashboardStats(tenantId, academicYearId)', 1)
          # Repeat for remaining handlers by inserting year variable where absent.
          marker = 'export const getDeptChart = async (req: any, res: Response) => {\n  try {\n    const tenantId = req.user?.tenantId;'
          s = s.replace(marker, marker + '\n    const academicYearId = (req as any).academicYearId as string | undefined;', 1)
          s = s.replace('const cacheKey = `teacher:dash:dept:${tenantId}`;', 'const cacheKey = `teacher:dash:dept:${tenantId}:${academicYearId || "all"}`;', 1)
          s = s.replace('getDepartmentChart(tenantId)', 'getDepartmentChart(tenantId, academicYearId)', 1)
          marker = 'export const getOverview = async (req: any, res: Response) => {\n  try {\n    const tenantId = req.user?.tenantId;'
          s = s.replace(marker, marker + '\n    const academicYearId = (req as any).academicYearId as string | undefined;', 1)
          s = s.replace('const cacheKey = `teacher:dash:overview:${tenantId}`;', 'const cacheKey = `teacher:dash:overview:${tenantId}:${academicYearId || "all"}`;', 1)
          s = s.replace('getMonthlyOverview(tenantId)', 'getMonthlyOverview(tenantId, academicYearId)', 1)
          marker = 'export const getRecent = async (req: any, res: Response) => {\n  try {\n    const tenantId = req.user?.tenantId;'
          s = s.replace(marker, marker + '\n    const academicYearId = (req as any).academicYearId as string | undefined;', 1)
          s = s.replace('getRecentTeachers(tenantId)', 'getRecentTeachers(tenantId, academicYearId)', 1)
          marker = 'export const getLeaves = async (req: any, res: Response) => {\n  try {\n    const tenantId = req.user?.tenantId;'
          s = s.replace(marker, marker + '\n    const academicYearId = (req as any).academicYearId as string | undefined;', 1)
          s = s.replace('where: { tenantId, isDeleted: false },\n      orderBy:',
                        'where: { tenantId, isDeleted: false, ...(academicYearId ? { academicYearId } : {}) },\n      orderBy:', 1)
          p.write_text(s)

          # Teacher leave reads must respect the selected year.
          p = Path('backend/src/modules/teacher/leave.service.ts')
          s = p.read_text()
          s = s.replace('  if (query.teacherId) {', '  if (query.academicYearId) whereClause.academicYearId = query.academicYearId;\n\n  if (query.teacherId) {', 1)
          s = s.replace('export const getLeaveStats = async (tenantId: string, teacherId?: string) => {',
                        'export const getLeaveStats = async (tenantId: string, teacherId?: string, academicYearId?: string) => {', 1)
          s = s.replace('  const whereBase: any = { tenantId, isDeleted: false };',
                        '  const whereBase: any = { tenantId, isDeleted: false, ...(academicYearId ? { academicYearId } : {}) };', 1)
          s = s.replace('    where: { id, tenantId, isDeleted: false },',
                        '    where: { id, tenantId, isDeleted: false, ...(academicYearId ? { academicYearId } : {}) },', 1)
          s = s.replace('  approvedBy: string,\n  tenantId: string\n)',
                        '  approvedBy: string,\n  tenantId: string,\n  academicYearId?: string\n)', 1)
          s = s.replace('export const cancelLeave = async (id: string, tenantId: string) => {',
                        'export const cancelLeave = async (id: string, tenantId: string, academicYearId?: string) => {', 1)
          p.write_text(s)

          p = Path('backend/src/modules/teacher/leave.controller.ts')
          s = p.read_text()
          s = s.replace('const data = await getLeaves(req.query, tenantId);',
                        'const data = await getLeaves({ ...req.query, academicYearId: (req as any).academicYearId || req.query.academicYearId }, tenantId);', 1)
          s = s.replace('const data = await getLeaveStats(tenantId, teacherId);',
                        'const data = await getLeaveStats(tenantId, teacherId, (req as any).academicYearId);', 1)
          s = s.replace('const data = await updateLeaveStatus(id, status, userId, tenantId);',
                        'const data = await updateLeaveStatus(id, status, userId, tenantId, (req as any).academicYearId);', 1)
          s = s.replace('await cancelLeave(id, tenantId);',
                        'await cancelLeave(id, tenantId, (req as any).academicYearId);', 1)
          p.write_text(s)

          # Validate leave teacher belongs to the selected year.
          p = Path('backend/src/modules/teacher/leave.service.ts')
          s = p.read_text()
          s = s.replace('where: { id: data.teacherId, tenantId, isDeleted: false },',
                        'where: { id: data.teacherId, tenantId, isDeleted: false, ...(data.academicYearId ? { academicYearId: data.academicYearId } : {}) },', 1)
          p.write_text(s)

          # Salary list/payslip/update reads follow selected year; creation inherits it.
          p = Path('backend/src/modules/teacher/salary.service.ts')
          s = p.read_text()
          s = s.replace('    tenantId,\n    isDeleted: false,\n  };',
                        '    tenantId,\n    isDeleted: false,\n  };\n\n  if (query.academicYearId) whereClause.academicYearId = query.academicYearId;', 1)
          s = s.replace('    tenantId\n) => {',
                        '    tenantId,\n    academicYearId?: string\n) => {', 1)
          s = s.replace('      tenantId,\n      isDeleted: false,\n    },\n    include:',
                        '      tenantId,\n      isDeleted: false,\n      ...(academicYearId ? { academicYearId } : {}),\n    },\n    include:', 1)
          s = s.replace('export const updateSalary = async (id: string, data: any, tenantId: string) => {',
                        'export const updateSalary = async (id: string, data: any, tenantId: string, academicYearId?: string) => {', 1)
          s = s.replace('where: { id, tenantId, isDeleted: false },',
                        'where: { id, tenantId, isDeleted: false, ...(academicYearId ? { academicYearId } : {}) },', 1)
          p.write_text(s)

          p = Path('backend/src/modules/teacher/salary.controller.ts')
          s = p.read_text()
          s = s.replace('const salary = await createSalary(req.body, tenantId);',
                        'const salary = await createSalary({ ...req.body, academicYearId: (req as any).academicYearId || req.body.academicYearId }, tenantId);', 1)
          s = s.replace('const data = await getSalaries(req.query, tenantId);',
                        'const data = await getSalaries({ ...req.query, academicYearId: (req as any).academicYearId || req.query.academicYearId }, tenantId);', 1)
          s = s.replace('const data = await getPayslip(teacherId, parseInt(month), parseInt(year), tenantId);',
                        'const data = await getPayslip(teacherId, parseInt(month), parseInt(year), tenantId, (req as any).academicYearId);', 1)
          s = s.replace('const data = await updateSalary(id, req.body, tenantId);',
                        'const data = await updateSalary(id, req.body, tenantId, (req as any).academicYearId);', 1)
          p.write_text(s)

          # Ensure no accidental unscoped teacher dashboard service endpoint remains in the primary UI.
          # Add year context to the standalone teacher-dashboard service as well for future callers.
          p = Path('backend/src/modules/teacher/teacher-dashboard.service.ts')
          s = p.read_text()
          s = s.replace('export const getTeacherDashboardData = async (tenantId: string) => {',
                        'export const getTeacherDashboardData = async (tenantId: string, academicYearId?: string) => {', 1)
          s = s.replace('where: { tenantId, isDeleted: false },',
                        'where: { tenantId, isDeleted: false, ...(academicYearId ? { academicYearId } : {}) },', 1)
          s = s.replace('where: { tenantId, isActive: true },',
                        'where: { tenantId, isActive: true },', 1)
          s = s.replace('tenantId,\n        month: currentMonth,',
                        'tenantId,\n        ...(academicYearId ? { academicYearId } : {}),\n        month: currentMonth,', 1)
          p.write_text(s)
          PY

      - name: Typecheck and build
        run: |
          cd frontend
          npm ci
          npm run build
          cd ../backend
          npm ci
          npx tsc --noEmit

      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/teachers/TeacherDashboard.tsx backend/src/modules/teacher
          git rm .github/workflows/fix-teacher-module-academic-year.yml
          git commit -m "fix: scope teacher module to academic year"
          git push origin main
