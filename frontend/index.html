<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── SEO ─────────────────────────────────────────────────────────── -->
    <title>College ERP</title>
    <meta name="description" content="College ERP — Student, Staff, Exam &amp; Fee Management System" />
    <meta name="theme-color" content="#4f46e5" />

    <!-- ── Favicon ─────────────────────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- ── DNS prefetch for API server (reduces first-request latency) ── -->
    <link rel="dns-prefetch" href="https://college-erp-backend-91zi.onrender.com" />
    <link rel="preconnect" href="https://college-erp-backend-91zi.onrender.com" crossorigin />

    <!-- ── Registration-page branding cleanup ──────────────────────────── -->
    <style>
      /* Keep the registration branding focused: logo + School ERP only. */
      .register-panel-brand > p,
      .register-panel-brand > div {
        display: none !important;
      }

      /* Make the generated login credentials immediately visible on mobile. */
      .register-success > div:nth-of-type(2) {
        background: #ffffff !important;
        border: 2px solid #10b981 !important;
        box-shadow: 0 8px 24px rgba(16, 185, 129, 0.16) !important;
      }

      .register-success > div:nth-of-type(2) p {
        color: #334155 !important;
        font-weight: 600 !important;
      }

      .register-success > div:nth-of-type(2) p:first-child {
        color: #166534 !important;
        font-size: 15px !important;
        font-weight: 800 !important;
      }

      .register-success > div:nth-of-type(2) p:nth-child(2),
      .register-success > div:nth-of-type(2) p:nth-child(3) {
        background: #ecfdf5 !important;
        border: 1px solid #86efac !important;
        border-radius: 9px !important;
        padding: 10px 12px !important;
        font-size: 15px !important;
        line-height: 1.4 !important;
      }

      .register-success > div:nth-of-type(2) p:nth-child(2) b,
      .register-success > div:nth-of-type(2) p:nth-child(3) b {
        color: #14532d !important;
        font-size: 16px !important;
        font-weight: 800 !important;
        overflow-wrap: anywhere;
      }

      .register-success > div:nth-of-type(2) p:last-child {
        color: #475569 !important;
        font-weight: 500 !important;
      }

      @media (max-width: 768px) {
        .register-panel-brand {
          padding-bottom: 48px !important;
        }

        .register-panel-brand img {
          margin-bottom: 10px !important;
        }

        .register-panel-brand h1 {
          margin-bottom: 0 !important;
        }

        .register-success > div:nth-of-type(2) {
          padding: 16px !important;
          margin-bottom: 16px !important;
        }
      }
    </style>

    <!-- ── PWA-ready: allow browser to cache assets aggressively ────────
         NOTE: We intentionally do NOT add no-cache / no-store meta tags.
         All JS/CSS assets have content-hash filenames so they are safe
         to cache forever. Only index.html itself should be re-validated. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
