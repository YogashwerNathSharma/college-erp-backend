name: P0-08 Apply Tenant Reference Hardening

on:
  push:
    branches:
      - security/p0-08-student-tenant-reference

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/p0-08-student-tenant-reference
          fetch-depth: 0

      - name: Apply minimal P0-08 patch
        shell: python
        run: |
          from pathlib import Path

          path = Path("backend/src/modules/students/student.service.ts")
          text = path.read_text(encoding="utf-8")

          marker = "// P0-08 tenant reference validation"
          if marker not in text:
              anchor = 'const ACTIVE_STATUSES = ["active", "pending", "verified"] as const;'
              helper = r'''

// P0-08 tenant reference validation
const assertStudentTenantReferences = async (
  tenantId: string,
  refs: {
    academicYearId?: string;
    classId?: string;
    sectionId?: string;
    religionId?: string;
    casteId?: string;
    categoryId?: string;
    nationalityId?: string;
  }
) => {
  const checks = await Promise.all([
    refs.academicYearId
      ? prisma.academicYear.findFirst({ where: { id: refs.academicYearId, tenantId } })
      : null,
    refs.classId
      ? prisma.class.findFirst({ where: { id: refs.classId, tenantId } })
      : null,
    refs.sectionId
      ? prisma.section.findFirst({ where: { id: refs.sectionId, tenantId } })
      : null,
    refs.religionId
      ? prisma.religion.findFirst({ where: { id: refs.religionId, tenantId } })
      : null,
    refs.casteId
      ? prisma.caste.findFirst({ where: { id: refs.casteId, tenantId } })
      : null,
    refs.categoryId
      ? prisma.category.findFirst({ where: { id: refs.categoryId, tenantId } })
      : null,
    refs.nationalityId
      ? prisma.nationality.findFirst({ where: { id: refs.nationalityId, tenantId } })
      : null,
  ]);

  const names = [
    "academic year",
    "class",
    "section",
    "religion",
    "caste",
    "category",
    "nationality",
  ];

  for (let i = 0; i < checks.length; i++) {
    if (checks[i] === null) continue;
    if (!checks[i]) {
      throw new Error(`Invalid ${names[i]} reference for current tenant`);
    }
  }
};
'''
              if anchor not in text:
                  raise SystemExit("P0-08 anchor not found")
              text = text.replace(anchor, anchor + helper, 1)

          call_anchor = "  // Auto-generate admission number if not provided\n"
          call = '''  await assertStudentTenantReferences(tenantId, {
    academicYearId,
    classId,
    sectionId,
    religionId,
    casteId,
    categoryId,
    nationalityId,
  });

'''
          if call_anchor not in text:
              raise SystemExit("P0-08 call anchor not found")
          text = text.replace(call_anchor, call + call_anchor, 1)

          path.write_text(text, encoding="utf-8")

      - name: Verify patch shape
        run: |
          grep -n "P0-08 tenant reference validation" backend/src/modules/students/student.service.ts
          grep -n "assertStudentTenantReferences" backend/src/modules/students/student.service.ts

      - name: Remove temporary workflow and commit patch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/modules/students/student.service.ts
          git rm .github/workflows/p0-08-apply.yml
          git commit -m "security: enforce student tenant reference isolation"
          git push origin security/p0-08-student-tenant-reference
