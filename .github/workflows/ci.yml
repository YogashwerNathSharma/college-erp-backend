name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install shared dependencies
        run: cd shared && npm install

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Install student portal dependencies
        run: cd student-portal && npm install

      - name: Build shared package
        run: cd shared && npm run build

      - name: Build backend
        run: cd backend && npm run build

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Build student portal
        run: cd student-portal && npm run build

  test:
    runs-on: ubuntu-latest
    needs: lint-and-build

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Build backend
        env:
          DATABASE_URL: mongodb://localhost:27017/college_erp_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key
          NODE_ENV: test
        run: cd backend && npm run build

      # Automated tests will be enabled when the backend test suite is added.
      - name: Test suite status
        run: echo "Backend build completed; automated test suite is not configured yet."
