name: Fix dashboard user runtime error

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch TenantDashboard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("frontend/src/pages/TenantDashboard.tsx")
          text = path.read_text()
          old = '  const navigate = useNavigate();\n'
          new = '''  const navigate = useNavigate();\n\n  // Restore authenticated user from localStorage for dashboard greeting/payment prefill.\n  const [user] = useState<any>(() => {\n    try {\n      return JSON.parse(localStorage.getItem("user") || "null");\n    } catch {\n      return null;\n    }\n  });\n'''
          if new in text:
              print("Dashboard user fix already present")
          elif old in text:
              path.write_text(text.replace(old, new, 1))
              print("Dashboard user fix applied")
          else:
              raise SystemExit("Expected insertion point not found")
          PY

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/TenantDashboard.tsx
          rm .github/workflows/fix-dashboard-user.yml
          git add .github/workflows/fix-dashboard-user.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: resolve dashboard user runtime error"
          git push origin main
