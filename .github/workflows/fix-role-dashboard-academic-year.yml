name: Fix role dashboard academic year sync

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-role-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Patch teacher/principal role dashboard
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/pages/teachers/TeacherPortal.tsx')
          s = p.read_text()

          if 'import { useAcademicYear } from "../../context/AcademicYearContext";' not in s:
              s = s.replace(
                  'import { getFullUrl } from "../../utils/url";\n',
                  'import { getFullUrl } from "../../utils/url";\nimport { useAcademicYear } from "../../context/AcademicYearContext";\n'
              )

          s = s.replace(
              'function DashboardSection({ user, isPrincipal }: { user: User | null; isPrincipal: boolean }) {',
              'function DashboardSection({ user, isPrincipal, academicYearId }: { user: User | null; isPrincipal: boolean; academicYearId?: string }) {'
          )
          s = s.replace(
              'params: { day: todayCode },',
              'params: { day: todayCode, ...(academicYearId ? { academicYearId } : {}) },',
              1
          )
          s = s.replace(
              'axios.get(getFullUrl("/api/students"), { headers: getAuthHeaders() }),',
              'axios.get(getFullUrl("/api/students"), { headers: getAuthHeaders(), params: academicYearId ? { academicYearId } : undefined }),',
              1
          )
          s = s.replace(
              '  }, []);\n\n  if (loading) return <Spinner />;\n\n  const statCards = [',
              '  }, [academicYearId]);\n\n  if (loading) return <Spinner />;\n\n  const statCards = [',
              1
          )

          marker = 'export default function TeacherPortal({ isPrincipal = false }: TeacherPortalProps) {'
          if marker in s and 'const { selectedAcademicYearId } = useAcademicYear();' not in s:
              s = s.replace(marker, marker + '\n  const { selectedAcademicYearId } = useAcademicYear();', 1)

          s = s.replace(
              'return <DashboardSection user={user} isPrincipal={isPrincipal} />;',
              'return <DashboardSection user={user} isPrincipal={isPrincipal} academicYearId={selectedAcademicYearId || undefined} />;'
          )

          p.write_text(s)
          PY

      - name: Validate changed dashboard file
        run: |
          test -s frontend/src/pages/teachers/TeacherPortal.tsx
          grep -q 'useAcademicYear' frontend/src/pages/teachers/TeacherPortal.tsx
          grep -q 'academicYearId' frontend/src/pages/teachers/TeacherPortal.tsx

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/pages/teachers/TeacherPortal.tsx
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'fix: scope teacher and principal dashboards to academic year'
            git push origin main
          fi

      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/fix-role-dashboard-academic-year.yml
          git commit -m 'chore: remove temporary role dashboard workflow'
          git push origin main
